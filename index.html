<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HeartDEV | Indie Game Studio</title>
  <meta name="description" content="HeartDEV LLC - Estudio independiente de desarrollo de videojuegos móviles y de PC." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0b0d13;
      --card-bg: rgba(22, 27, 34, 0.7);
      --accent: #ff3366;
      --accent-glow: rgba(255, 51, 102, 0.25);
      --text: #f0f6fc;
      --text-muted: #8b949e;
      --border: rgba(255, 255, 255, 0.08);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 2rem 1.5rem;
      background-image: radial-gradient(circle at 50% 20%, rgba(255, 51, 102, 0.08) 0%, transparent 60%);
    }
    header { text-align: center; margin-top: 4rem; }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 0.4rem 1rem;
      border-radius: 999px;
      font-size: 0.85rem;
      color: var(--accent);
      font-weight: 500;
      margin-bottom: 1.5rem;
    }
    .badge-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
    }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.03em;
      margin-bottom: 1rem;
    }
    h1 span { color: var(--accent); }
    p.lead {
      color: var(--text-muted);
      font-size: 1.15rem;
      max-width: 550px;
      line-height: 1.6;
      margin: 0 auto 2.5rem;
    }
    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 600;
      padding: 0.85rem 1.75rem;
      border-radius: 8px;
      transition: all 0.2s ease;
      font-size: 0.95rem;
    }
    .btn-primary {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 4px 20px var(--accent-glow);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 25px rgba(255, 51, 102, 0.4);
    }
    .btn-secondary {
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }
    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.85rem;
      margin-top: 4rem;
    }
  </style>
</head>
<body>
  <div></div>
  <main>
    <header>
      <div class="badge">
        <div class="badge-dot"></div>
        Estudio de Desarrollo Independiente
      </div>
      <h1>Heart<span>DEV</span></h1>
      <p class="lead">
        Creando experiencias y mecánicas únicas para videojuegos móviles e independientes. Próximo proyecto en fase de preproducción.
      </p>
      <div class="btn-group">
        <a href="mailto:admin@heartdev.dev" class="btn btn-primary">Contactar Estudio</a>
      </div>
    </header>
  </main>
  <footer>
    &copy; 2026 HeartDEV LLC. Todos los derechos reservados.
  </footer>
</body>
</html>
